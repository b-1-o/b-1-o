<rect x="50" y="312" width="900" height="8" rx="4" fill="#1a1a1a"></rect>

<rect x="50" y="312" width="855" height="8" rx="4" fill="url(#bar)" filter="url(#glow)">

  <animate attributeName="width" from="0" to="855" dur="1.7s" fill="freeze"></animate>

</rect>

</svg>