<svg width="1000" height="350" viewBox="0 0 1000 350" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">

    <stop offset="0%" stop-color="#444"></stop>
    <stop offset="50%" stop-color="#ffffff"></stop>
    <stop offset="100%" stop-color="#777"></stop>

  </linearGradient>

  <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">

    <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>

    <feMerge>
      <feMergeNode in="blur"></feMergeNode>
      <feMergeNode in="SourceGraphic"></feMergeNode>
    </feMerge>

  </filter>

</defs>


<rect width="1000" height="350" rx="14" fill="#080808" stroke="#222"></rect>


<!-- HTML -->

<text x="50" y="48" fill="#ffffff" font-family="monospace" font-size="15">

  HTML

</text>

<text x="950" y="48" text-anchor="end" fill="#777" font-family="monospace" font-size="13">

  100%

</text>

<rect x="50" y="62" width="900" height="8" rx="4" fill="#1a1a1a"></rect>

<rect x="50" y="62" width="900" height="8" rx="4" fill="url(#bar)" filter="url(#glow)">

  <animate attributeName="width" from="0" to="900" dur="1.2s" fill="freeze"></animate>

</rect>


<!-- CSS -->

<text x="50" y="98" fill="#ffffff" font-family="monospace" font-size="15">

  CSS

</text>

<text x="950" y="98" text-anchor="end" fill="#777" font-family="monospace" font-size="13">

  95%

</text>

<rect x="50" y="112" width="900" height="8" rx="4" fill="#1a1a1a"></rect>

<rect x="50" y="112" width="855" height="8" rx="4" fill="url(#bar)" filter="url(#glow)">

  <animate attributeName="width" from="0" to="855" dur="1.3s" fill="freeze"></animate>

</rect>


<!-- JavaScript -->

<text x="50" y="148" fill="#ffffff" font-family="monospace" font-size="15">

  JavaScript

</text>

<text x="950" y="148" text-anchor="end" fill="#777" font-family="monospace" font-size="13">

  80%

</text>

<rect x="50" y="162" width="900" height="8" rx="4" fill="#1a1a1a"></rect>

<rect x="50" y="162" width="720" height="8" rx="4" fill="url(#bar)" filter="url(#glow)">

  <animate attributeName="width" from="0" to="720" dur="1.4s" fill="freeze"></animate>

</rect>


