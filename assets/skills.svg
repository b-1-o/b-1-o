<text x="50" y="198" fill="#ffffff" font-family="monospace" font-size="15">

  Python

</text>

<text x="950" y="198" text-anchor="end" fill="#777" font-family="monospace" font-size="13">

  70%

</text>

<rect x="50" y="212" width="900" height="8" rx="4" fill="#1a1a1a"></rect>

<rect x="50" y="212" width="630" height="8" rx="4" fill="url(#bar)" filter="url(#glow)">

  <animate attributeName="width" from="0" to="630" dur="1.5s" fill="freeze"></animate>

</rect>


<!-- Swift -->

<text x="50" y="248" fill="#ffffff" font-family="monospace" font-size="15">

  Swift

</text>

<text x="950" y="248" text-anchor="end" fill="#777" font-family="monospace" font-size="13">

