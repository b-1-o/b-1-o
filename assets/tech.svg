<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333" stop-opacity="0"/>
      <stop offset="30%" stop-color="#666" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#666" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#333" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Top decorative line -->
  <line x1="180" y1="18" x2="720" y2="18" stroke="url(#lineGrad)" stroke-width="1"/>
  
  <!-- Main tech text -->
  <text x="450" y="48" text-anchor="middle" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="17" fill="#d0d0d0" letter-spacing="6">
    HTML  ·  CSS  ·  JAVASCRIPT
  </text>
  
  <text x="450" y="78" text-anchor="middle" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="17" fill="#d0d0d0" letter-spacing="6">
    PYTHON  ·  SWIFT  ·  LINUX
  </text>
  
  <!-- Bottom decorative line -->
  <line x1="180" y1="95" x2="720" y2="95" stroke="url(#lineGrad)" stroke-width="1"/>
</svg>
