<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444" stop-opacity="0"/>
      <stop offset="20%" stop-color="#666" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#666" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" fill="#0a0a0a"/>

  <line x1="60" y1="22" x2="840" y2="22" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- CORE -->
  <text x="360" y="58" text-anchor="end"
