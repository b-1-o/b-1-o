<svg xmlns="http://www.w3.org/2000/svg" width="900" height="50" viewBox="0 0 900 50">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444" stop-opacity="0"/>
      <stop offset="20%" stop-color="#666" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#666" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#444" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Black background -->
  <rect width="900" height="50" fill="#0a0a0a"/>
  
  <!-- Top line -->
  <line x1="80" y1="10" x2="820" y2="10" stroke="url(#lineGrad)" stroke-width="1"/>
  
  <!-- Single line text -->
  <text x="450" y="32" text-anchor="middle" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="15" fill="#d0d0d0" letter-spacing="4">
    HTML  ·  CSS  ·  JAVASCRIPT  ·  PYTHON  ·  SWIFT  ·  LINUX
  </text>
  
  <!-- Bottom line -->
  <line x1="80" y1="42" x2="820" y2="42" stroke="url(#lineGrad)" stroke-width="1"/>
</svg>
