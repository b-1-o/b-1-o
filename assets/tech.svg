        font-size="10" fill="#6a6a6a" letter-spacing="3">CORE</text>
  <text x="390" y="58" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" fill="#d0d0d0" letter-spacing="2">HTML  ·  CSS  ·  JavaScript  ·  TypeScript</text>

  <!-- FRAMEWORKS -->
  <text x="360" y="90" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="10" fill="#6a6a6a" letter-spacing="3">FRAMEWORKS</text>
  <text x="390" y="90" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" fill="#d0d0d0" letter-spacing="2">React  ·  Next.js  ·  Vite</text>

  <!-- STYLING -->
  <text x="360" y="122" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="10" fill="#6a6a6a" letter-spacing="3">STYLING</text>
  <text x="390" y="122" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" fill="#d0d0d0" letter-spacing="2">Tailwind CSS  ·  CSS Modules</text>

  <!-- MOTION & FORMS -->
  <text x="360" y="154" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="10" fill="#6a6a6a" letter-spacing="3">MOTION &amp; FORMS</text>
  <text x="390" y="154" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" fill="#d0d0d0" letter-spacing="2">Framer Motion  ·  Zod</text>

  <!-- BACKEND & DATA -->
  <text x="360" y="186" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="10" fill="#6a6a6a" letter-spacing="3">BACKEND &amp; DATA</text>
  <text x="390" y="186" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" fill="#d0d0d0" letter-spacing="2">Node.js  ·  PostgreSQL  ·  Neon  ·  REST APIs</text>

  <!-- TOOLING -->
  <text x="360" y="218" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="10" fill="#6a6a6a" letter-spacing="3">TOOLING</text>
  <text x="390" y="218" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" fill="#d0d0d0" letter-spacing="2">Git  ·  GitHub  ·  Vercel  ·  ESLint  ·  Prettier</text>

  <!-- DESIGN -->
  <text x="360" y="250" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="10" fill="#6a6a6a" letter-spacing="3">DESIGN</text>
  <text x="390" y="250" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
