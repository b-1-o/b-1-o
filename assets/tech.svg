  </text>

  <!-- DESIGN -->
  <text x="240" y="228" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="11" fill="#6a6a6a" letter-spacing="3">DESIGN</text>
  <text x="270" y="228" text-anchor="start"
