  <!-- TOOLING -->
  <text x="240" y="198" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="11" fill="#6a6a6a" letter-spacing="3">TOOLING</text>
  <text x="270" y="198" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#d0d0d0" letter-spacing="2">
