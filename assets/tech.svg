<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444" stop-opacity="0"/>
      <stop offset="20%" stop-color="#666" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#666" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="240" fill="#0a0a0a"/>

  <line x1="60" y1="18" x2="840" y2="18" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- CORE -->
  <text x="240" y="48" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="11" fill="#6a6a6a" letter-spacing="3">CORE</text>
  <text x="270" y="48" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#d0d0d0" letter-spacing="2">
    HTML  ·  CSS  ·  JavaScript  ·  TypeScript
  </text>

  <!-- FRAMEWORKS -->
  <text x="240" y="78" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="11" fill="#6a6a6a" letter-spacing="3">FRAMEWORKS</text>
  <text x="270" y="78" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#d0d0d0" letter-spacing="2">
    React  ·  Next.js  ·  Vite
  </text>

  <!-- STYLING -->
  <text x="240" y="108" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="11" fill="#6a6a6a" letter-spacing="3">STYLING</text>
  <text x="270" y="108" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#d0d0d0" letter-spacing="2">
    Tailwind CSS  ·  CSS Modules
  </text>

  <!-- MOTION & FORMS -->
  <text x="240" y="138" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="11" fill="#6a6a6a" letter-spacing="3">MOTION &amp; FORMS</text>
  <text x="270" y="138" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#d0d0d0" letter-spacing="2">
    Framer Motion  ·  Zod
  </text>

  <!-- BACKEND & DATA -->
  <text x="240" y="168" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="11" fill="#6a6a6a" letter-spacing="3">BACKEND &amp; DATA</text>
  <text x="270" y="168" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#d0d0d0" letter-spacing="2">
