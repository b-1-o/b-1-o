<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Forest image -->
    <filter id="dark">
      <feColorMatrix type="matrix" values="
        0.35 0 0 0 0
        0 0.35 0 0 0
        0 0 0.35 0 0
        0 0 0 1 0"></feColorMatrix>
    </filter>

    <!-- Main glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <!-- Soft glow -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"></feGaussianBlur>
    </filter>

    <!-- Dark gradient -->
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">

      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"></stop>

      <stop offset="50%" stop-color="#000000" stop-opacity="0.58"></stop>

      <stop offset="100%" stop-color="#000000" stop-opacity="0.82"></stop>

    </linearGradient>

    <!-- Bottom fade -->
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">

      <stop offset="0%" stop-color="#000000" stop-opacity="0"></stop>

      <stop offset="100%" stop-color="#000000" stop-opacity="0.9"></stop>

    </linearGradient>

    <!-- Button gradient -->
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">

      <stop offset="0%" stop-color="#111111" stop-opacity="0.92"></stop>

      <stop offset="100%" stop-color="#050505" stop-opacity="0.96"></stop>

    </linearGradient>

    <!-- Animated glow -->
    <radialGradient id="mist">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.13"></stop>

      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>

  </defs>


  <!-- ========================= -->
  <!-- FOREST -->
  <!-- ========================= -->

  <image href="./forest.jpg" x="0" y="0" width="1200" height="520" preserveAspectRatio="xMidYMid slice" filter="url(#dark)"></image>


  <!-- ========================= -->
  <!-- DARK OVERLAY -->
  <!-- ========================= -->

  <rect x="0" y="0" width="1200" height="520" fill="url(#overlay)"></rect>


  <!-- ========================= -->
  <!-- MOVING FOG -->
  <!-- ========================= -->

  <ellipse cx="200" cy="400" rx="300" ry="100" fill="url(#mist)" filter="url(#softGlow)" opacity="0.5">

    <animate attributeName="cx" values="200;400;200" dur="14s" repeatCount="indefinite"></animate>

    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="9s" repeatCount="indefinite"></animate>

  </ellipse>


  <ellipse cx="1000" cy="130" rx="260" ry="90" fill="url(#mist)" filter="url(#softGlow)" opacity="0.25">

    <animate attributeName="cx" values="1000;820;1000" dur="18s" repeatCount="indefinite"></animate>

  </ellipse>


  <!-- ========================= -->
  <!-- TOP DECORATION -->
  <!-- ========================= -->

  <line x1="470" y1="65" x2="730" y2="65" stroke="#ffffff" stroke-opacity="0.35"></line>

  <text x="600" y="48" text-anchor="middle" fill="#888888" font-family="monospace" font-size="12" letter-spacing="5">
    THE FOREST REMEMBERS
  </text>


  <!-- ========================= -->
  <!-- NAME -->
  <!-- ========================= -->

  <text x="600" y="155" text-anchor="middle" fill="#ffffff" font-family="serif" font-size="72" font-weight="bold" filter="url(#glow)">

    𝔟-𝟙-𝔬

    <animate attributeName="opacity" values="0;1" dur="1.8s" fill="freeze"></animate>

  </text>


  <!-- ========================= -->
  <!-- DESCRIPTION -->
  <!-- ========================= -->

  <text x="600" y="195" text-anchor="middle" fill="#dddddd" font-family="monospace" font-size="16" letter-spacing="3">

    developer · linux · web · systems

  </text>


  <!-- ========================= -->
  <!-- QUOTE -->
  <!-- ========================= -->

  <text x="600" y="245" text-anchor="middle" fill="#aaaaaa" font-family="serif" font-size="17" font-style="italic">

    “I did not disappear. I simply became part of the fog.”

  </text>


  <!-- ========================= -->
  <!-- SOCIAL BUTTONS -->
  <!-- ========================= -->

  <!-- GitHub -->

  <g>
    <rect x="170" y="300" width="155" height="48" rx="12" fill="url(#button)" stroke="#777777" stroke-opacity="0.5"></rect>

    <text x="247" y="330" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" letter-spacing="1">

      ◈  GITHUB

    </text>

    <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"></animate>
  </g>


  <!-- TikTok -->

  <g>
    <rect x="335" y="300" width="155" height="48" rx="12" fill="url(#button)" stroke="#777777" stroke-opacity="0.5"></rect>

    <text x="412" y="330" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" letter-spacing="1">

      ♪  TIKTOK

    </text>
  </g>


  <!-- Instagram -->

  <g>
    <rect x="500" y="300" width="155" height="48" rx="12" fill="url(#button)" stroke="#777777" stroke-opacity="0.5"></rect>

    <text x="577" y="330" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" letter-spacing="1">

      ◎  INSTAGRAM

    </text>
  </g>


  <!-- Telegram -->

  <g>
    <rect x="665" y="300" width="155" height="48" rx="12" fill="url(#button)" stroke="#777777" stroke-opacity="0.5"></rect>

    <text x="742" y="330" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" letter-spacing="1">

      ➤  TELEGRAM

    </text>
  </g>


  <!-- Discord -->

  <g>
    <rect x="830" y="300" width="155" height="48" rx="12" fill="url(#button)" stroke="#777777" stroke-opacity="0.5"></rect>

    <text x="907" y="330" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" letter-spacing="1">

      ◉  DISCORD

    </text>
  </g>


  <!-- ========================= -->
  <!-- BOTTOM -->
  <!-- ========================= -->

  <line x1="390" y1="400" x2="810" y2="400" stroke="#ffffff" stroke-opacity="0.15"></line>

  <text x="600" y="430" text-anchor="middle" fill="#777777" font-family="monospace" font-size="11" letter-spacing="4">

    WEB · SYSTEMS · LINUX · DEVELOPMENT

  </text>


  <text x="600" y="470" text-anchor="middle" fill="#555555" font-family="monospace" font-size="10" letter-spacing="2">

    // written in candlelight &amp; fog

  </text>


  <!-- Bottom fade -->

  <rect x="0" y="300" width="1200" height="220" fill="url(#bottomFade)" opacity="0.45"></rect>

</svg>