<svg width="900" height="310" viewBox="0 0 900 310" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="fog" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#555"></stop>
    <stop offset="50%" stop-color="#fff"></stop>
    <stop offset="100%" stop-color="#777"></stop>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
    <feMerge>
      <feMergeNode in="blur"></feMergeNode>
      <feMergeNode in="SourceGraphic"></feMergeNode>
    </feMerge>
  </filter>
</defs>

<rect width="900" height="310" rx="12" fill="#080808"></rect>

<!-- HTML -->
<text x="30" y="45" fill="#fff" font-family="monospace" font-size="16">HTML</text>
<text x="850" y="45" fill="#777" font-family="monospace" font-size="16" text-anchor="end">100%</text>
<rect x="30" y="57" width="840" height="8" rx="4" fill="#1b1b1b"></rect>
<rect x="30" y="57" width="840" height="8" rx="4" fill="url(#fog)" filter="url(#glow)">
  <animate attributeName="width" from="0" to="840" dur="1.2s" fill="freeze"></animate>
</rect>

<!-- CSS -->
<text x="30" y="95" fill="#fff" font-family="monospace" font-size="16">CSS</text>
<text x="850" y="95" fill="#777" font-family="monospace" font-size="16" text-anchor="end">95%</text>
<rect x="30" y="107" width="840" height="8" rx="4" fill="#1b1b1b"></rect>
<rect x="30" y="107" width="798" height="8" rx="4" fill="url(#fog)" filter="url(#glow)">
  <animate attributeName="width" from="0" to="798" dur="1.2s" fill="freeze"></animate>
</rect>

<!-- JavaScript -->
<text x="30" y="145" fill="#fff" font-family="monospace" font-size="16">JavaScript</text>
<text x="850" y="145" fill="#777" font-family="monospace" font-size="16" text-anchor="end">80%</text>
<rect x="30" y="157" width="840" height="8" rx="4" fill="#1b1b1b"></rect>
<rect x="30" y="157" width="672" height="8" rx="4" fill="url(#fog)" filter="url(#glow)">
  <animate attributeName="width" from="0" to="672" dur="1.2s" fill="freeze"></animate>
</rect>

<!-- Python -->
<text x="30" y="195" fill="#fff" font-family="monospace" font-size="16">Python</text>
<text x="850" y="195" fill="#777" font-family="monospace" font-size="16" text-anchor="end">70%</text>
<rect x="30" y="207" width="840" height="8" rx="4" fill="#1b1b1b"></rect>
<rect x="30" y="207" width="588" height="8" rx="4" fill="url(#fog)" filter="url(#glow)">
  <animate attributeName="width" from="0" to="588" dur="1.2s" fill="freeze"></animate>
</rect>

<!-- Swift -->
<text x="30" y="245" fill="#fff" font-family="monospace" font-size="16">Swift</text>
<text x="850" y="245" fill="#777" font-family="monospace" font-size="16" text-anchor="end">60%</text>
<rect x="30" y="257" width="840" height="8" rx="4" fill="#1b1b1b"></rect>
<rect x="30" y="257" width="504" height="8" rx="4" fill="url(#fog)" filter="url(#glow)">
  <animate attributeName="width" from="0" to="504" dur="1.2s" fill="freeze"></animate>
</rect>

<!-- Linux -->
<text x="30" y="295" fill="#fff" font-family="monospace" font-size="16">Linux</text>
<text x="850" y="295" fill="#777" font-family="monospace" font-size="16" text-anchor="end">95%</text>
<rect x="30" y="307" width="840" height="8" rx="4" fill="#1b1b1b"></rect>
<rect x="30" y="307" width="798" height="8" rx="4" fill="url(#fog)" filter="url(#glow)">
  <animate attributeName="width" from="0" to="798" dur="1.2s" fill="freeze"></animate>
</rect>

</svg>